name: os-matrix
# Manual only: native pytest without Docker on three OSes. Not on push, no badge - a red run here
# must never change the status of the official check (check.yml).
on:
  workflow_dispatch:
jobs:
  quick:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install the pinned wheels offline
        run: python -m pip install --no-index --find-links vendor/wheels --no-deps -r requirements.txt
      - name: Fast tests (no slow marker)
        env:
          PYTHONHASHSEED: "0"
          TZ: UTC
          PYTHONPATH: .
        run: python -m pytest -q -m "not slow"
